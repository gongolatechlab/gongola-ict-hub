<script>
window.onerror = function(msg, url, line, col, error) {
  var div = document.createElement('div');
  div.style.cssText = 'padding: 20px; color: red; font-family: monospace; background: white; font-size: 14px; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999;';
  div.innerHTML = 'Error: ' + msg + '<br>Line: ' + line + '<br>URL: ' + url;
  document.documentElement.appendChild(div);
};
</script>

<script>
  const SUPABASE_URL = 'https://usayycqwgdyklfzrinvc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_aRLgeNmCRrvmOsW8d7YOlA_lEtVuGaE';
  const AI_ENDPOINT = "https://script.google.com/macros/s/AKfycbzjI8nb-XFZEOBRrefmIPolUb2Y_gc_a5ESmOxDATJWqwx0dvHcILWONt7TtiFa-DKmXg/exec";
  const EXECUTE_ENDPOINT = "https://script.google.com/macros/s/AKfycbyDNGb5VOJvIpbblUBd1PQaTiEvtqWc5wjNo8bXY4HCyIAYQLc9FWOA0YXktFEpqxIl/exec";
  const POSITIONS_ENDPOINT = EXECUTE_ENDPOINT;
  let livePositions = [];

  let supabaseClient = null;
  let signalsData = [];
  let currentSigDir = 'BUY';

  function checkPin() {
    const pin = document.getElementById('admin-pin').value;
    if (pin === "1973") {
      document.getElementById('pin-gate').classList.add('hidden');
      document.getElementById('main-content').classList.remove('hidden');
      document.getElementById('admin-app').classList.remove('hidden');
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        fetchSignals();
        fetchPositions();
        setInterval(fetchPositions, 30000);
      }
    } else {
      alert("Incorrect PIN");
    }
  }

  document.getElementById('admin-app').classList.remove('hidden');

  function showAlert(message, type = 'error') {
    const modal = document.getElementById('custom-alert');
    const box = document.getElementById('alert-box');
    const iconDiv = document.getElementById('alert-icon');
    const iconSvg = document.getElementById('alert-svg');
    const title = document.getElementById('alert-title');
    document.getElementById('alert-message').innerText = message;
    if (type === 'error') { iconDiv.className = 'mx-auto mb-4 w-14 h-14 rounded-full flex items-center justify-center bg-loss/20 text-loss'; iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>'; title.innerText = "Error"; }
    else { iconDiv.className = 'mx-auto mb-4 w-14 h-14 rounded-full flex items-center justify-center bg-win/20 text-win'; iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>'; title.innerText = "Success"; }
    modal.classList.remove('hidden'); modal.classList.add('flex');
    setTimeout(() => box.classList.remove('scale-95'), 10);
  }
  function hideAlert() { const modal = document.getElementById('custom-alert'); const box = document.getElementById('alert-box'); box.classList.add('scale-95'); setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200); }

  async function fetchSignals() {
    const { data, error } = await supabaseClient.from('signals').select('*').order('created_at', { ascending: false });
    if (error) return document.getElementById('signal-list').innerHTML = '<div class="text-center text-loss">Failed to load signals.</div>';
    
    const seen = new Map(); const deduped = [];
    data.forEach(sig => {
      let sym = sig.asset.toUpperCase();
      if (sym === 'GOLD' || sym === 'XAUUSD') sym = 'XAUUSD';
      const key = `${sym}-${sig.direction}-${sig.entry}-${sig.sl}-${sig.tp}-${sig.result}`;
      if (!seen.has(key)) { seen.set(key, true); deduped.push({ ...sig, displaySymbol: sym, alias: sig.asset === 'GOLD' ? 'XAUUSD' : (sig.asset === 'XAUUSD' ? 'GOLD' : null) }); }
    });

    signalsData = deduped; renderSignals();
  }

  function renderSignals() {
    const list = document.getElementById('signal-list');
    if (signalsData.length === 0) return list.innerHTML = '<div class="text-center text-muted text-sm p-8">No signals found.</div>';
    
    list.innerHTML = signalsData.map(s => {
      const isPending = s.result === 'pending' || !s.result;
      
      let livePos = null;
      // 1. Try exact deal_id match (dealId or workingOrderId)
      if (s.deal_id) {
        const targetId = String(s.deal_id).toLowerCase().trim();
        livePos = livePositions.find(p => {
          if (!p.position) return false;
          const pDeal = p.position.dealId ? String(p.position.dealId).toLowerCase().trim() : '';
          const pWork = p.position.workingOrderId ? String(p.position.workingOrderId).toLowerCase().trim() : '';
          return pDeal === targetId || pWork === targetId;
        });
      }
      // 2. Bulletproof Fallback: if exactly ONE open trade exists, match it to ANY pending signal of the same direction
      if (!livePos && isPending && livePositions.length === 1) {
        const liveDir = String(livePositions[0].position.direction).toUpperCase().trim();
        if (liveDir === String(s.direction).toUpperCase().trim()) {
          livePos = livePositions[0];
        }
      }
      // 3. Secondary Fallback: match by Asset + Direction
      if (!livePos && isPending) {
        livePos = livePositions.find(p => {
          if (!p.position) return false;
          const sameDir = String(p.position.direction).toUpperCase().trim() === String(s.direction).toUpperCase().trim();
          const posEpic = String(p.market && p.market.epic ? p.market.epic : '').toUpperCase().trim();
          const sigAsset = String(s.asset || '').toUpperCase().trim();
          return sameDir && (posEpic.includes(sigAsset) || sigAsset.includes(posEpic) || (posEpic.includes('XAU') && sigAsset.includes('XAU')));
        });
      }
      let execBtn = '';
      if (!isPending) {
        execBtn = '<button disabled class="flex-1 py-2 bg-surface2 text-muted rounded-lg text-[10px] font-bold min-w-[70px] border border-line">Closed</button>';
      } else if (livePos) {
        const upl = livePos.position.upl || 0;
        const uplColor = upl >= 0 ? 'text-win' : 'text-loss';
        const uplText = upl >= 0 ? `+$${upl.toFixed(2)}` : `-$${Math.abs(upl).toFixed(2)}`;
        execBtn = `<button onclick="fetchPositions()" class="flex-1 py-2 bg-amber-500/20 text-amber-500 border border-amber-500 rounded-lg text-[10px] font-bold min-w-[70px] flex justify-center gap-1 items-center">Open <span class="${uplColor}">${uplText}</span></button>`;
      } else {
        execBtn = `<button onclick="executeTrade('${s.id}')" class="flex-1 py-2 bg-win text-bg rounded-lg text-[10px] font-bold min-w-[70px]">Execute</button>`;
      }
      const statusColor = isPending ? 'border-accent' : s.result === 'win' ? 'border-win' : 'border-loss';
      const statusBg = isPending ? 'bg-accent/10 text-accent' : s.result === 'win' ? 'bg-win/10 text-win' : 'bg-loss/10 text-loss';
      
      const risk = Math.abs(s.entry - s.sl); const reward = Math.abs(s.tp - s.entry);
      const rr = risk > 0 ? (reward / risk).toFixed(1) : '--';
      const rrColor = rr >= 1.5 ? 'text-win' : rr >= 1 ? 'text-yellow-400' : 'text-loss';
      
      const slPts = (s.entry - s.sl).toFixed(1);
      const tpPts = (s.tp - s.entry).toFixed(1);
      const aliasTag = s.alias ? `<span class="text-[9px] text-muted ml-1">also ${s.alias}</span>` : '';

      const prices = [s.entry, s.sl, s.tp];
      const min = Math.min(...prices); const max = Math.max(...prices); const range = max - min || 1;
      const pctSL = ((s.sl - min) / range) * 100; const pctEntry = ((s.entry - min) / range) * 100; const pctTP = ((s.tp - min) / range) * 100;
      const leftPin = Math.min(pctSL, pctTP); const rightPin = Math.max(pctSL, pctTP);
      
      let pctCurrent = 0; let currentPrice = 0; let showLivePin = false;
      if (livePos && livePos.market) {
        currentPrice = livePos.market.bid;
        pctCurrent = ((currentPrice - min) / range) * 100;
        pctCurrent = Math.max(0, Math.min(100, pctCurrent));
        showLivePin = true;
      }
      
      

      return `
      <div class="sig-card border border-line rounded-xl overflow-hidden mb-3 border-l-4 ${statusColor} ${!isPending ? 'opacity-70' : ''}">
        <div class="p-4 border-b border-line flex justify-between items-center bg-surface2">
          <div class="flex items-center gap-3">
            <span class="text-lg font-bold font-mono">${s.asset}${aliasTag}</span>
            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${s.direction === 'BUY' ? 'bg-win/10 text-win' : 'bg-loss/10 text-loss'}">${s.direction}</span>
            <span class="text-[10px] font-mono text-muted" title="${new Date(s.created_at).toLocaleString()}">${timeAgo(s.created_at)}</span>
            
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[9px] font-bold uppercase tracking-wider px-2 py-1 rounded ${statusBg}">${isPending ? 'PENDING' : s.result.toUpperCase()}</span>
            ${livePos ? `<span class="text-[9px] font-bold px-2 py-1 rounded bg-bg border border-line ${livePos.position.upl >= 0 ? 'text-win' : 'text-loss'}">${livePos.position.upl >= 0 ? '+' : '-'}$${Math.abs(livePos.position.upl).toFixed(2)}</span>` : ''}
            <button onclick="deleteSignal('${s.id}')" class="text-muted hover:text-loss transition-colors p-1"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
          </div>
        </div>
        
        <div class="p-4">
          <div class="flex justify-between items-center mb-4">
             <span class="text-[10px] font-mono ${rrColor} bg-bg px-2 py-1 rounded border border-line">R:R 1:${rr}</span>
          </div>

          <div class="relative h-1.5 bg-bg rounded-full mb-6 mx-2 mt-4">
            <div class="absolute h-full bg-loss/50 rounded-l-full" style="width: ${leftPin}%; left: 0;"></div>
            <div class="absolute h-full bg-win/50 rounded-r-full" style="width: ${100 - rightPin}%; left: ${rightPin}%;"></div>
            <div class="absolute w-0.5 h-3 -top-1 bg-white -translate-x-1/2" style="left: ${pctSL}%;"><span class="absolute -top-4 -translate-x-1/2 text-[8px] text-muted font-bold">SL</span></div>
            <div class="absolute w-0.5 h-3 -top-1 bg-accent -translate-x-1/2 z-10" style="left: ${pctEntry}%;"><span class="absolute -top-4 -translate-x-1/2 text-[8px] text-accent font-bold">ENTRY</span></div>
            <div class="absolute w-0.5 h-3 -top-1 bg-white -translate-x-1/2" style="left: ${pctTP}%;"><span class="absolute -top-4 -translate-x-1/2 text-[8px] text-muted font-bold">TP</span></div>
            ${showLivePin ? `<div class="absolute w-0.5 h-4 -top-1.5 bg-cyan-400 -translate-x-1/2 z-20 shadow-[0_0_8px_rgba(34,211,238,0.8)] transition-all duration-500" style="left: ${pctCurrent}%;"><span class="absolute -top-5 -translate-x-1/2 text-[9px] text-cyan-400 font-bold whitespace-nowrap bg-bg/80 px-1 rounded">${currentPrice}</span></div>` : ''}
            ${showLivePin ? `<div class="absolute w-0.5 h-4 -top-1.5 bg-cyan-400 -translate-x-1/2 z-20 shadow-[0_0_8px_rgba(34,211,238,0.8)] transition-all duration-500" style="left: ${pctCurrent}%;"><span class="absolute -top-5 -translate-x-1/2 text-[9px] text-cyan-400 font-bold whitespace-nowrap bg-bg/80 px-1 rounded">${currentPrice}</span></div>` : ''}
          </div>

          <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="bg-bg rounded-lg border border-line p-2 text-center"><div class="text-[9px] text-muted uppercase mb-1">Entry</div><div class="text-xs font-mono font-bold text-white">${s.entry}</div></div>
            <div class="bg-bg rounded-lg border border-line p-2 text-center"><div class="text-[9px] text-muted uppercase mb-1">SL</div><div class="text-xs font-mono font-bold text-loss">${s.sl}</div><div class="text-[8px] font-mono text-loss mt-0.5">${slPts} pts</div></div>
            <div class="bg-bg rounded-lg border border-line p-2 text-center"><div class="text-[9px] text-muted uppercase mb-1">TP</div><div class="text-xs font-mono font-bold text-win">${s.tp}</div><div class="text-[8px] font-mono text-win mt-0.5">+${tpPts} pts</div></div>
          </div>

          <div class="flex border-b border-line mb-3">
            <button onclick="toggleAdminTab('${s.id}', 'chart', this)" class="tab-btn flex-1 py-2 text-[11px] font-bold text-muted border-b-2 border-transparent hover:text-white transition-all">Chart</button>
            <button onclick="toggleAdminTab('${s.id}', 'analysis', this)" class="tab-btn flex-1 py-2 text-[11px] font-bold text-muted border-b-2 border-transparent hover:text-white transition-all">Analysis</button>
          </div>
          
          <div id="a-panel-chart-${s.id}" class="hidden mb-3">
            ${s.image_url ? `<img src="${s.image_url}" alt="Chart" class="w-full rounded-lg border border-line">` : '<p class="text-[10px] text-muted">No chart image.</p>'}
          </div>
          <div id="a-panel-analysis-${s.id}" class="hidden mb-3">
            <p class="text-[11px] text-muted bg-bg p-2 rounded border border-line leading-relaxed">${s.analysis || 'No analysis.'}</p>
          </div>
        </div>
        
        <div class="p-3 border-t border-line flex flex-wrap gap-2 bg-surface2 mt-2">
          ${execBtn}
          <button onclick="updateResult('${s.id}', 'win')" class="flex-1 py-2 bg-bg border border-line rounded-lg text-[10px] font-bold text-muted hover:text-win hover:border-win min-w-[70px]">Win</button>
          <button onclick="updateResult('${s.id}', 'loss')" class="flex-1 py-2 bg-bg border border-line rounded-lg text-[10px] font-bold text-muted hover:text-loss hover:border-loss min-w-[70px]">Loss</button>
          <button onclick="copyAdminTrade('${s.asset}', '${s.direction}', ${s.entry}, ${s.sl}, ${s.tp}, ${rr})" class="py-2 px-3 bg-bg border border-line rounded-lg text-[10px] font-bold text-muted hover:text-white hover:border-accent">Copy</button>
        </div>
      </div>`}).join('');
  }
  async function updateResult(id, result) {
    const { error } = await supabaseClient.from('signals').update({ result }).eq('id', id);
    if (error) return showAlert('Failed to update status', 'error');
    fetchSignals();
  }
  async function deleteSignal(id) {
    if (confirm('Delete this signal permanently?')) {
      const { error } = await supabaseClient.from('signals').delete().eq('id', id);
      if (error) return showAlert('Failed to delete signal', 'error');
      fetchSignals();
    }
  }

  function timeAgo(dateString) {
    const date = new Date(dateString); const now = new Date(); const seconds = Math.floor((now - date) / 1000);
    if (seconds < 60) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    return `${Math.floor(hours / 24)}d ago`;
  }

  function toggleAdminTab(id, tab, btn) {
    const chartPanel = document.getElementById(`a-panel-chart-${id}`);
    const analysisPanel = document.getElementById(`a-panel-analysis-${id}`);
    const isActive = btn.classList.contains('active');
    
    btn.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    chartPanel.classList.add('hidden'); analysisPanel.classList.add('hidden');
    
    if (!isActive) {
      btn.classList.add('active');
      if (tab === 'chart') chartPanel.classList.remove('hidden');
      else analysisPanel.classList.remove('hidden');
    }
  }

  function copyAdminTrade(sym, dir, entry, sl, tp, rr) {
    const text = `${sym} ${dir}\nEntry: ${entry}\nSL: ${sl}\nTP: ${tp}\nR:R 1:${rr}\n\nEducational purposes only. Not financial advice.`;
    navigator.clipboard.writeText(text).then(() => alert('Trade copied to clipboard!'));
  }

  function toggleSignalImage(id) {
    const container = document.getElementById(`img-container-${id}`); const text = document.getElementById(`img-text-${id}`); const icon = document.getElementById(`img-icon-${id}`);
    if (container.classList.contains('hidden')) { container.classList.remove('hidden'); text.innerText = 'Hide Chart'; icon.style.transform = 'rotate(180deg)'; }
    else { container.classList.add('hidden'); text.innerText = 'View Chart'; icon.style.transform = 'rotate(0deg)'; }
  }

  async function fetchPositions() {
    if (!supabaseClient) return;
    try {
      const res = await fetch(POSITIONS_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'positions' }) });
      const data = await res.json();
      if (data.status === 'success' && data.data.positions) {
        livePositions = data.data.positions;
        const dbg = document.getElementById('debug-box');
        if (dbg) {
          if (livePositions.length > 0) {
            dbg.innerText = "LIVE CAPITAL.COM DATA:\n" + JSON.stringify(livePositions[0], null, 2);
          } else {
            dbg.innerText = "LIVE CAPITAL.COM DATA: [] (No open trades)";
          }
        }
        
        const strip = document.getElementById('pl-strip');
        if (strip) {
          if (livePositions.length > 0) {
            strip.classList.remove('hidden');
            let totalUpl = 0;
            livePositions.forEach(p => { totalUpl += (p.position.upl || 0); });
            
            const totalEl = document.getElementById('pl-total');
            totalEl.innerText = (totalUpl >= 0 ? '+$' : '-$') + Math.abs(totalUpl).toFixed(2);
            totalEl.className = 'text-sm font-mono font-bold ' + (totalUpl >= 0 ? 'text-win' : 'text-loss');
            
            document.getElementById('pl-count').innerText = livePositions.length;
            document.getElementById('pl-time').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          } else {
            strip.classList.add('hidden');
          }
        }

        if (typeof renderSignals === 'function') renderSignals();
        else if (typeof render === 'function') render();
      }
    } catch(e) {
      console.error("Positions fetch failed", e);
      const strip = document.getElementById('pl-strip');
      if (strip) {
        strip.classList.remove('hidden');
        document.getElementById('pl-total').innerText = "Error";
        document.getElementById('pl-total').className = "text-sm font-mono font-bold text-loss";
        document.getElementById('pl-count').innerText = "-";
        document.getElementById('pl-time').innerText = "Failed";
      }
    }
  }

  async function executeTrade(id) {
    const sig = signalsData.find(s => s.id === id);
    if (!sig) return;
    if (!confirm(`Execute ${sig.direction} ${sig.asset} on Capital.com DEMO account?`)) return;
    showAlert("Sending order to Capital.com...", "success");
    try {
      const res = await fetch(EXECUTE_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ epic: sig.asset, direction: sig.direction, size: 1.0, stopLevel: sig.sl, profitLevel: sig.tp }) });
      const data = await res.json();
      
      if (data.status === 'success') {
        const dealId = data.data.dealId || data.data.dealReference;
        if (dealId) {
          await supabaseClient.from('signals').update({ deal_id: dealId }).eq('id', id);
          sig.deal_id = dealId;
        }
        showAlert("Trade Executed! Deal ID: " + dealId, "success");
        fetchPositions();
      } else {
        // Show the exact error from Capital.com
        let errorMsg = data.detail || 'Unknown error';
        try {
          const parsed = JSON.parse(errorMsg);
          errorMsg = parsed.errorCode || errorMsg;
        } catch(e) {}
        showAlert("Execution Failed: " + errorMsg, "error");
      }
    } catch (err) { showAlert("Connection failed. Check your internet or Apps Script deployment.", "error"); }
  }

  function toggleSignalModal() {
    const modal = document.getElementById('signal-modal');
    if (modal.open) return modal.close();
    document.getElementById('signal-form').reset();
    setSigDir('BUY');
    document.getElementById('sig-image-preview-container').classList.add('hidden');
    document.getElementById('manual-fields').classList.add('hidden');
    modal.showModal();
  }
  document.getElementById('close-modal-btn').addEventListener('click', toggleSignalModal);

  function setSigDir(dir) {
    currentSigDir = dir; document.getElementById('sig-direction').value = dir;
    const b = document.getElementById('sig-btn-buy'), s = document.getElementById('sig-btn-sell');
    if (dir === 'BUY') { b.className = 'flex-1 py-2.5 rounded-lg border border-win bg-win/10 text-win font-bold text-sm transition-all flex justify-center items-center gap-2'; s.className = 'flex-1 py-2.5 rounded-lg border border-transparent text-muted font-bold text-sm transition-all flex justify-center items-center gap-2'; }
    else { s.className = 'flex-1 py-2.5 rounded-lg border border-loss bg-loss/10 text-loss font-bold text-sm transition-all flex justify-center items-center gap-2'; b.className = 'flex-1 py-2.5 rounded-lg border border-transparent text-muted font-bold text-sm transition-all flex justify-center items-center gap-2'; }
  }

  function updateLiveRR() {
    const entry = parseFloat(document.getElementById('sig-entry').value); const sl = parseFloat(document.getElementById('sig-sl').value); const tp = parseFloat(document.getElementById('sig-tp').value);
    const rrEl = document.getElementById('rr-display');
    if (!isNaN(entry) && !isNaN(sl) && !isNaN(tp)) {
      const risk = Math.abs(entry - sl); const reward = Math.abs(tp - entry);
      if (risk > 0) { const rr = (reward / risk).toFixed(1); rrEl.innerText = `Expected R:R = 1 : ${rr}`; rrEl.className = `text-center text-xs font-mono font-bold mt-1 ${rr >= 1.5 ? 'text-win' : rr >= 1 ? 'text-yellow-400' : 'text-loss'}`; return; }
    }
    rrEl.innerText = 'Expected R:R = 1 : --'; rrEl.className = 'text-center text-xs font-mono font-bold text-muted mt-1';
  }
  ['sig-entry-display', 'sig-sl-display', 'sig-tp-display'].forEach(id => document.getElementById(id).addEventListener('input', updateLiveRR));

  document.getElementById('sig-image-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = async function() {
        const canvas = document.createElement('canvas'); canvas.width = 800; canvas.height = img.height * (800 / img.width);
        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const base64Data = canvas.toDataURL('image/jpeg', 0.7);
        document.getElementById('sig-image-preview').src = base64Data; document.getElementById('sig-image-preview-container').classList.remove('hidden');
        document.getElementById('sig-image-loading').classList.remove('hidden'); document.getElementById('sig-image-loading').classList.add('flex');
        const notesArea = document.getElementById('sig-notes'); notesArea.value = "🤖 AI is reading the chart structure..."; notesArea.disabled = true;
        try {
          const res = await fetch(AI_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'analyze_chart', image: base64Data }) });
          const text = await res.text(); let data; try { data = JSON.parse(text); } catch { throw new Error("Invalid server response."); }
          if(data.error) throw new Error(data.error);
          if (data.asset) document.getElementById('sig-asset').value = data.asset.toUpperCase();
          if (data.category) { const catSelect = document.getElementById('sig-cat'); catSelect.value = data.category.charAt(0).toUpperCase() + data.category.slice(1).toLowerCase(); }
          if (data.entry) { document.getElementById('sig-entry').value = data.entry; document.getElementById('sig-entry-display').value = data.entry; }
          if (data.sl) { document.getElementById('sig-sl').value = data.sl; document.getElementById('sig-sl-display').value = data.sl; }
          if (data.tp) { document.getElementById('sig-tp').value = data.tp; document.getElementById('sig-tp-display').value = data.tp; }
          setSigDir(data.direction && data.direction.toUpperCase() === 'SELL' ? 'SELL' : 'BUY');
          updateLiveRR();
          notesArea.value = data.analysis ? data.analysis.replace(/\*/g, '') : "AI finished, but no analysis text was returned.";
        } catch (err) { notesArea.value = "Error: " + err.message; }
        finally { notesArea.disabled = false; document.getElementById('manual-fields').classList.remove('hidden'); document.getElementById('sig-image-loading').classList.add('hidden'); document.getElementById('sig-image-loading').classList.remove('flex'); }
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('signal-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn'); btn.innerText = "Publishing..."; btn.disabled = true;
    const asset = document.getElementById('sig-asset').value.toUpperCase().trim(); const cat = document.getElementById('sig-cat').value;
    const entry = document.getElementById('sig-entry').value; const sl = document.getElementById('sig-sl').value; const tp = document.getElementById('sig-tp').value;
    const analysis = document.getElementById('sig-notes').value.trim(); const fileInput = document.getElementById('sig-image-input');
    let imageUrl = null;
    try {
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0]; const fileName = `${Date.now()}.${file.name.split('.').pop()}`;
        const { error: uploadError } = await supabaseClient.storage.from('charts').upload(fileName, file);
        if (uploadError) throw uploadError;
        const { data: publicUrlData } = supabaseClient.storage.from('charts').getPublicUrl(fileName); imageUrl = publicUrlData.publicUrl;
      }
      const { error: insertError } = await supabaseClient.from('signals').insert([{ asset, category: cat, direction: currentSigDir, entry, sl, tp, analysis, image_url: imageUrl }]);
      if (insertError) throw insertError;
      showAlert("Signal published successfully!", "success"); toggleSignalModal(); fetchSignals();
    } catch (err) { showAlert("Failed to post signal: " + err.message, "error"); }
    finally { btn.innerText = "Publish Signal"; btn.disabled = false; }
  });
</script>

<div id="install-toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[300] w-[90%] max-w-sm hidden">
  <div class="bg-surface border border-line rounded-xl p-4 shadow-2xl flex items-center justify-between gap-4">
    <div><p class="text-sm font-bold text-white">Install Admin App</p><p class="text-xs text-muted">Add to home screen for easy access.</p></div>
    <div class="flex gap-2"><button id="close-install" class="text-xs font-bold text-muted px-2">Later</button><button id="install-btn" class="text-xs font-bold bg-accent text-bg px-3 py-1.5 rounded-lg">Install</button></div>
  </div>
</div>

</body>
</html>
