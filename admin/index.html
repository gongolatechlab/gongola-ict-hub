<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>Admin Panel · Gongola ICT Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0a0e13', surface: '#1F2833', surface2: '#151E26',
          text: '#eef1fb', muted: '#8d97b8', line: 'rgba(255,255,255,0.1)',
          win: '#00FF66', loss: '#FF3B30', accent: '#00E5FF', open: '#F5A524'
        },
        fontFamily: { display: ['"Space Grotesk"', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] }
      }
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">

<style>
  /* CRITICAL LAYOUT FIXES */
  body { background-color: #0a0e13; color: #eef1fb; font-family: 'Space Grotesk', system-ui, sans-serif; margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  
  .bg-surface2 { background-color: #151E26; }
  .bg-surface { background-color: #1F2833; }
  .bg-bg { background-color: #0a0e13; }
  .bg-accent { background-color: #00E5FF; }
  .bg-win { background-color: #00FF66; }
  .bg-loss { background-color: #FF3B30; }
  .bg-open { background-color: #F5A524; }
  
  .text-muted { color: #8d97b8; }
  .text-white { color: #ffffff; }
  .text-accent { color: #00E5FF; }
  .text-win { color: #00FF66; }
  .text-loss { color: #FF3B30; }
  .text-bg { color: #0a0e13; }
  
  .border { border-width: 1px; border-style: solid; }
  .border-line { border-color: rgba(255,255,255,0.1); }
  .border-accent { border-color: #00E5FF; }
  .border-win { border-color: #00FF66; }
  .border-loss { border-color: #FF3B30; }
  
  .rounded-xl { border-radius: 12px; }
  .rounded-lg { border-radius: 8px; }
  .rounded-full { border-radius: 9999px; }
  
  .p-4 { padding: 16px; }
  .p-3 { padding: 12px; }
  .p-2 { padding: 8px; }
  .px-4 { padding-left: 16px; padding-right: 16px; }
  .py-3 { padding-top: 12px; padding-bottom: 12px; }
  .py-2 { padding-top: 8px; padding-bottom: 8px; }
  .px-3 { padding-left: 12px; padding-right: 12px; }
  .py-1 { padding-top: 4px; padding-bottom: 4px; }
  .mb-1 { margin-bottom: 4px; }
  .mb-2 { margin-bottom: 8px; }
  .mb-4 { margin-bottom: 16px; }
  .mt-2 { margin-top: 8px; }
  .mt-4 { margin-top: 16px; }
  .mr-1 { margin-right: 4px; }
  .mr-2 { margin-right: 8px; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .space-y-3 > * + * { margin-top: 12px; }
  
  .flex { display: flex; }
  .grid { display: grid; }
  .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .justify-between { justify-content: space-between; }
  .justify-center { justify-content: center; }
  .items-center { align-items: center; }
  .flex-col { flex-direction: column; }
  
  .w-4 { width: 16px; }
  .h-4 { height: 16px; }
  .w-8 { width: 32px; }
  .h-8 { height: 32px; }
  .w-full { width: 100%; }
  .h-full { height: 100%; }
  
  .text-xs { font-size: 12px; line-height: 1rem; }
  .text-sm { font-size: 14px; line-height: 1.25rem; }
  .text-lg { font-size: 18px; line-height: 1.75rem; }
  .text-xl { font-size: 20px; line-height: 1.75rem; }
  .text-\[10px\] { font-size: 10px; }
  
  .font-bold { font-weight: 700; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .uppercase { text-transform: uppercase; }
  .tracking-widest { letter-spacing: 0.1em; }
  
  .overflow-x-hidden { overflow-x: hidden; }
  .overflow-hidden { overflow: hidden; }
  .hidden { display: none !important; }
  .relative { position: relative; }
  .absolute { position: absolute; }
  .fixed { position: fixed; }
  .sticky { position: sticky; }
  .top-0 { top: 0; }
  .z-30 { z-index: 30; }
  .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
  
  .shadow-\[0_0_10px_rgba\(0\,229\,255\,0\.4\)\] { box-shadow: 0 0 10px rgba(0,229,255,0.4); }
  .shadow-\[0_0_15px_rgba\(0\,255\,102\,0\.3\)\] { box-shadow: 0 0 15px rgba(0,255,102,0.3); }
  .hover\:brightness-110:hover { filter: brightness(1.1); }
  
  /* Fix for the giant icons */
  svg { display: inline-block; vertical-align: middle; max-width: 24px; max-height: 24px; }
  
  /* Card layout fix */
  .card {
    background: #1F2833;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    display: block;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: #8d97b8;
  }
  .card.open::before { background: #00FF66; }
  .card.pending::before { background: #F5A524; }
  .card.closed::before { background: #8d97b8; }
  
  .head { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; cursor: pointer; }
  .pair { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
  .side { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  .side.buy { background: rgba(0,255,102,0.1); color: #00FF66; }
  .side.sell { background: rgba(255,59,48,0.1); color: #FF3B30; }
  .meta { font-size: 12px; color: #8d97b8; margin-top: 2px; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; display: inline-block; margin-top: 4px; }
  .badge.open { background: rgba(0,255,102,0.15); color: #00FF66; }
  .badge.pending { background: rgba(245,165,36,0.15); color: #F5A524; }
  .badge.closed { background: rgba(255,255,255,0.05); color: #8d97b8; }
  
  .body { display: none; border-top: 1px solid rgba(255,255,255,0.1); padding: 12px 14px; background: #151E26; }
  .card.exp .body { display: block; }
  
  .pl { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .chev { width: 20px; height: 20px; color: #8d97b8; transition: transform 0.2s; margin-top: 4px; }
  .card.exp .chev { transform: rotate(180deg); }
  
  .bar-wrap { padding-top: 10px; padding-bottom: 10px; }
  .price-track { height: 6px; background: #0a0e13; border-radius: 99px; position: relative; margin: 15px 0 25px 0; }
  .zone-sl { position: absolute; left: 0; height: 100%; background: rgba(255,59,48,0.5); border-radius: 99px 0 0 99px; }
  .zone-tp { position: absolute; right: 0; height: 100%; background: rgba(0,255,102,0.5); border-radius: 0 99px 99px 0; }
  .pin { position: absolute; top: -4px; width: 2px; height: 14px; background: #fff; transform: translateX(-50%); }
  .pin-label { position: absolute; top: -20px; font-size: 9px; font-weight: 700; color: #8d97b8; transform: translateX(-50%); white-space: nowrap; }
  .pin.entry { background: #00E5FF; z-index: 2; width: 3px; }
  .pin.live { background: #00E5FF; z-index: 3; width: 3px; box-shadow: 0 0 10px #00E5FF; }
  
  .actions { display: flex; gap: 6px; margin-top: 12px; justify-content: space-between; }
  .act { height: 32px; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; border: 1px solid transparent; }
  .act.danger { background: #FF3B30; color: #fff; }
  .act.ghost { background: #1F2833; color: #eef1fb; border-color: rgba(255,255,255,0.1); }
  
  .tab-btn { flex: 1; padding: 8px 4px; background: none; border: none; color: #8d97b8; font-weight: 600; font-size: 12px; border-bottom: 2px solid transparent; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tab-btn.active { color: #00E5FF !important; border-bottom-color: #00E5FF !important; }
  
  .chip { border-radius: 999px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .chip.on { background: rgba(0,229,255,0.1); border-color: #00E5FF; color: #00E5FF; }
</style>


<style>
  /* Force P/L Colors */
  .pnl-pos { color: #00FF66 !important; }
  .pnl-neg { color: #FF3B30 !important; }
  
  /* Any element with font-mono that holds a P/L value */
  .pl .num.pos { color: #00FF66 !important; }
  .pl .num.neg { color: #FF3B30 !important; }
  
  /* Explicit check for the closed cards to ensure color is correct */
  .card.closed .pl .num { color: inherit; }
</style>


<style>
  /* Force pair name size */
  .pair { font-size: 16px !important; }
  .pair span { font-size: 16px !important; }
</style>


<style>
  /* ABSOLUTE MODAL OVERRIDES */
  #lot-size-modal, #scale-out-modal, #account-modal, #custom-alert-modal, #signal-modal {
    position: fixed !important; inset: 0 !important;
    background: rgba(0,0,0,0.85) !important;
    z-index: 999999 !important;
    display: flex !important; flex-direction: column !important;
    align-items: center !important; justify-content: center !important;
    padding: 20px !important;
  }

  #lot-size-modal > div, #scale-out-modal > div, #account-modal > div, #custom-alert-modal > div {
    background: #0c1220 !important;
    border: 1px solid rgba(120,150,200,0.16) !important;
    border-radius: 20px !important;
    padding: 24px !important;
    width: 100% !important;
    max-width: 380px !important;
    box-shadow: 0 10px 50px rgba(0,0,0,0.9) !important;
    color: #fff !important;
  }

  #signal-modal > form {
    background: #0c1220 !important;
    border: 1px solid rgba(120,150,200,0.16) !important;
    border-radius: 20px !important;
    padding: 24px !important;
    width: 100% !important;
    max-width: 500px !important;
    box-shadow: 0 10px 50px rgba(0,0,0,0.9) !important;
    color: #fff !important;
    max-height: 90vh !important;
    overflow-y: auto !important;
  }

  /* Text colors inside modals */
  #lot-size-modal h2, #scale-out-modal h2, #account-modal h2, #signal-modal h2 {
    color: #fff !important; font-size: 22px !important; font-weight: 700 !important; margin-bottom: 8px !important;
  }
  #lot-size-modal p, #scale-out-modal p {
    color: #8e9bb3 !important; font-size: 14px !important; margin-bottom: 16px !important;
  }

  /* Inputs */
  #lot-size-modal input, #signal-modal input[type="text"], #signal-modal input[type="number"], #signal-modal select, #signal-modal textarea {
    background: #0f1627 !important; border: 1px solid rgba(120,150,200,0.16) !important;
    color: #fff !important; border-radius: 10px !important; padding: 12px !important;
    font-family: 'JetBrains Mono', monospace !important; font-size: 16px !important; width: 100% !important;
    margin-bottom: 12px !important;
  }

  /* Buttons inside modals */
  #lot-size-modal button, #scale-out-modal button, #account-modal button, #signal-modal button {
    border-radius: 12px !important; font-weight: 700 !important; font-size: 15px !important;
    padding: 14px !important; border: none !important;
  }
  #lot-size-modal #confirm-lot-btn, #signal-modal #submit-btn {
    background: #22e58f !important; color: #000 !important;
  }
  #lot-size-modal button[onclick*="remove"], #account-modal button[onclick*="remove"], #signal-modal button[type="button"] {
    background: #0f1627 !important; color: #fff !important; border: 1px solid rgba(120,150,200,0.16) !important;
  }
</style>

</head>
<body class="text-text font-display antialiased overflow-x-hidden min-h-screen">

  <header class="top sticky top-0 z-30 glass border-b border-line px-4 py-3">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center font-bold text-bg shadow-[0_0_10px_rgba(0,229,255,0.4)]">A</div>
        <div><h1 class="font-bold text-lg leading-tight">Admin Panel</h1><p class="text-[10px] font-mono text-muted uppercase tracking-widest">Gongola ICT Hub</p></div>
      </div>
      <div class="flex gap-2">
        <button onclick="toggleSignalModal()" class="px-4 py-2 bg-win text-bg font-bold text-xs rounded-lg shadow-[0_0_15px_rgba(0,255,102,0.3)] hover:brightness-110 transition-all flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg> Post Signal
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-4">
    <div class="grid grid-cols-2 gap-3" id="summary">
      <div class="stat balance bg-surface2 border border-line p-3 rounded-xl cursor-pointer" onclick="openAccountInfo()">
        <p class="text-[10px] font-mono text-muted uppercase mb-1">Balance</p>
        <p id="ui-balance" class="text-lg font-mono font-bold text-white">$0.00</p>
        <p class="text-[10px] font-mono text-muted mt-1">P/L: <span id="ui-total-pl" class="text-xs">$0.00</span></p>
      </div>
      <div class="stat winrate bg-surface2 border border-line p-3 rounded-xl">
        <p class="text-[10px] font-mono text-muted uppercase mb-1">Win Rate</p>
        <p id="ui-winrate" class="text-lg font-mono font-bold text-white">0%</p>
      </div>
    </div>

    <div class="flex justify-between items-center text-xs font-mono text-muted">
      <span><span class="inline-block w-2 h-2 rounded-full bg-accent mr-1 animate-pulse"></span>Live · updated <span id="ui-upd">--:--</span></span>
      <button onclick="forceSync()" class="text-accent bg-surface2 px-2 py-1 rounded">Retry Sync</button>
    </div>

    <div class="flex gap-2 overflow-x-auto pb-2" id="filters">
      <button class="chip on px-3 py-1 rounded-full border border-accent bg-accent/10 text-accent text-xs font-bold" data-f="all">All <span id="ui-cnt-all">0</span></button>
      <button class="chip px-3 py-1 rounded-full border border-line bg-surface2 text-muted text-xs font-bold" data-f="open">Open <span id="ui-cnt-open">0</span></button>
      <button class="chip px-3 py-1 rounded-full border border-line bg-surface2 text-muted text-xs font-bold" data-f="pending">Waiting <span id="ui-cnt-pending">0</span></button>
      <button class="chip px-3 py-1 rounded-full border border-line bg-surface2 text-muted text-xs font-bold" data-f="closed">Closed <span id="ui-cnt-closed">0</span></button>
    </div>

    <div id="signal-list" class="space-y-3">
      <div class="text-center text-muted text-sm p-8">Connecting to Database...</div>
    </div>
  </main>

  <!-- Post Signal Modal -->
  <div id="signal-modal" style="display:none !important;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999999;align-items:flex-end;justify-content:center;">
    <div style="background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:24px;max-height:90vh;overflow-y:auto;border:1px solid var(--line);border-bottom:none;">
      <form id="signal-form" style="display:flex;flex-direction:column;gap:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h2 style="font-size:20px;color:#fff;">Post Signal</h2>
          <button type="button" onclick="toggleSignalModal()" style="background:var(--card2);border-radius:50%;padding:8px;color:var(--muted);">✕</button>
        </div>
        <div>
          <label style="display:block;font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;">Upload Chart</label>
          <input type="file" id="sig-image-input" accept="image/*" style="width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--muted);">
          <div id="sig-image-preview-container" style="display:none;margin-top:10px;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);">
            <img id="sig-image-preview" style="width:100%;max-height:200px;object-fit:contain;background:#000;">
            <div id="sig-image-loading" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.7);flex-direction:column;align-items:center;justify-content:center;">
              <div style="width:30px;height:30px;border:3px solid var(--cyan);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:8px;"></div>
              <span style="color:var(--cyan);font-weight:bold;">AI Reading...</span>
            </div>
          </div>
        </div>
        <div id="manual-fields" style="display:none;flex-direction:column;gap:12px;">
          <input type="hidden" id="sig-entry"><input type="hidden" id="sig-sl"><input type="hidden" id="sig-tp">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;">
              <label style="display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">Asset</label>
              <input type="text" id="sig-asset" placeholder="XAUUSD" required style="width:100%;background:transparent;border:none;color:#fff;font-family:var(--mono);font-size:16px;font-weight:bold;outline:none;">
            </div>
            <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;">
              <label style="display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">Category</label>
              <select id="sig-cat" style="width:100%;background:transparent;border:none;color:#fff;font-family:var(--mono);font-size:16px;font-weight:bold;outline:none;">
                <option>Forex</option><option>Crypto</option><option>Indices</option><option>Commodities</option>
              </select>
            </div>
          </div>
          <div style="display:flex;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px;">
            <button type="button" onclick="setSigDir('BUY')" id="sig-btn-buy" style="flex:1;padding:10px;border-radius:8px;font-weight:bold;border:1px solid var(--green);background:rgba(25,230,140,0.1);color:var(--green);">BUY</button>
            <button type="button" onclick="setSigDir('SELL')" id="sig-btn-sell" style="flex:1;padding:10px;border-radius:8px;font-weight:bold;border:1px solid transparent;color:var(--muted);">SELL</button>
            <input type="hidden" id="sig-direction" value="BUY">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
            <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;">
              <label style="display:block;font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px;">Entry</label>
              <input type="number" id="sig-entry-display" step="any" style="width:100%;background:transparent;border:none;color:#fff;font-family:var(--mono);font-weight:bold;text-align:center;outline:none;" oninput="document.getElementById('sig-entry').value=this.value">
            </div>
            <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;">
              <label style="display:block;font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px;">SL</label>
              <input type="number" id="sig-sl-display" step="any" style="width:100%;background:transparent;border:none;color:var(--red);font-family:var(--mono);font-weight:bold;text-align:center;outline:none;" oninput="document.getElementById('sig-sl').value=this.value">
            </div>
            <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;">
              <label style="display:block;font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px;">TP</label>
              <input type="number" id="sig-tp-display" step="any" style="width:100%;background:transparent;border:none;color:var(--green);font-family:var(--mono);font-weight:bold;text-align:center;outline:none;" oninput="document.getElementById('sig-tp').value=this.value">
            </div>
          </div>
          <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;">
            <label style="display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">Analysis</label>
            <textarea id="sig-notes" rows="3" style="width:100%;background:transparent;border:none;color:#fff;outline:none;resize:none;"></textarea>
          </div>
        </div>
        <button type="submit" id="submit-btn" style="width:100%;padding:16px;background:var(--cyan);color:#000;font-weight:bold;font-size:16px;border-radius:14px;margin-top:8px;">Publish Signal</button>
      </form>
    </div>
  </div>

  <script src="app3.js"></script>
</body>
</html>
