<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Admin Panel | Gongola ICT Hub</title>
<meta name="theme-color" content="#0B0C10">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0B0C10', surface: '#1F2833', surface2: '#151E26',
          text: '#eef1fb', muted: '#8d97b8', line: 'rgba(255,255,255,0.1)',
          win: '#00FF66', loss: '#FF3B30', accent: '#00E5FF', open: '#F5A524'
        },
        fontFamily: { display: ['"Space Grotesk"', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] }
      }
    }
  }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="text-text font-display antialiased overflow-x-hidden min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-30 glass border-b border-line px-4 py-3">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center font-bold text-bg shadow-[0_0_10px_rgba(0,229,255,0.4)]">A</div>
        <div><h1 class="font-bold text-lg leading-tight">Admin Panel</h1><p class="text-[10px] font-mono text-muted uppercase tracking-widest">Gongola ICT Hub</p></div>
      </div>
      <div class="flex gap-2">
        <button onclick="toggleSignalModal()" class="px-4 py-2 bg-win text-bg font-bold text-xs rounded-lg shadow-[0_0_15px_rgba(0,255,102,0.3)] hover:brightness-110 transition-all flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg> Post Signal
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-4">
    <!-- Running P/L Strip -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-surface2 border border-line p-3 rounded-xl">
        <p class="text-[10px] font-mono text-muted uppercase mb-1">Total P/L</p>
        <p id="strip-pnl" class="text-lg font-mono font-bold text-muted">$0.00</p>
      </div>
      <div class="bg-surface2 border border-line p-3 rounded-xl">
        <p class="text-[10px] font-mono text-muted uppercase mb-1">Open Trades</p>
        <p id="strip-open" class="text-lg font-mono font-bold text-white">0</p>
      </div>
      <div class="bg-surface2 border border-line p-3 rounded-xl">
        <p class="text-[10px] font-mono text-muted uppercase mb-1">Last Update</p>
        <p id="strip-time" class="text-lg font-mono font-bold text-muted">--:--</p>
      </div>
    </div>

    <!-- Signals List -->
    <div id="signal-list" class="space-y-3">
      <div class="text-center text-muted text-sm p-8">Connecting to Database...</div>
    </div>
  </main>

  <!-- Post Signal Modal -->
  <dialog id="signal-modal" class="bg-surface text-text w-full max-w-lg mt-auto mb-0 md:m-auto rounded-t-2xl md:rounded-2xl border border-line p-0 backdrop:bg-black/80 backdrop:backdrop-blur-sm">
    <form id="signal-form" class="p-5 flex flex-col gap-4 max-h-[90vh] overflow-y-auto pb-safe">
      <div class="flex justify-between items-center mb-2"><h2 class="text-xl font-bold">Post Signal</h2><button type="button" onclick="toggleSignalModal()" class="p-2 bg-surface2 rounded-full text-muted hover:text-white"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button></div>
      <div><label class="block text-[10px] font-mono text-muted uppercase mb-1">Upload Chart</label><input type="file" id="sig-image-input" accept="image/*" class="w-full bg-bg border border-line rounded-lg px-3 py-3 text-sm text-muted file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-bold file:bg-win file:text-bg hover:file:brightness-110 transition-all cursor-pointer"><div id="sig-image-preview-container" class="hidden mt-2 relative rounded-lg overflow-hidden border border-line"><img id="sig-image-preview" class="w-full max-h-48 object-contain bg-black"><div id="sig-image-loading" class="absolute inset-0 bg-black/70 hidden flex-col items-center justify-center backdrop-blur-sm"><div class="w-8 h-8 border-4 border-accent border-t-transparent rounded-full animate-spin mb-2"></div><span class="text-sm font-bold text-accent">AI Reading Chart...</span></div></div></div>
      <div id="manual-fields" class="hidden flex flex-col gap-3 mt-2">
        <input type="hidden" id="sig-entry"><input type="hidden" id="sig-sl"><input type="hidden" id="sig-tp">
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-surface2 p-3 rounded-xl border border-line"><label class="block text-[10px] font-mono text-muted uppercase mb-1">Asset</label><input type="text" id="sig-asset" placeholder="XAUUSD" required class="w-full bg-transparent font-mono text-lg font-bold uppercase text-white outline-none"></div>
          <div class="bg-surface2 p-3 rounded-xl border border-line"><label class="block text-[10px] font-mono text-muted uppercase mb-1">Category</label><select id="sig-cat" class="w-full bg-transparent font-mono text-lg font-bold text-white outline-none appearance-none"><option>Forex</option><option>Crypto</option><option>Indices</option><option>Commodities</option></select></div>
        </div>
        <div class="bg-surface2 p-1.5 rounded-xl border border-line flex gap-1"><button type="button" onclick="setSigDir('BUY')" id="sig-btn-buy" class="flex-1 py-2.5 rounded-lg border border-win bg-win/10 text-win font-bold text-sm transition-all flex justify-center items-center gap-2"><div class="w-2 h-2 rounded-full bg-win"></div> BUY</button><button type="button" onclick="setSigDir('SELL')" id="sig-btn-sell" class="flex-1 py-2.5 rounded-lg border border-transparent text-muted font-bold text-sm transition-all flex justify-center items-center gap-2"><div class="w-2 h-2 rounded-full bg-loss"></div> SELL</button><input type="hidden" id="sig-direction" value="BUY"></div>
        <div class="grid grid-cols-3 gap-2"><div class="bg-surface2 p-2 rounded-lg border border-line"><label class="block text-[9px] font-mono text-muted uppercase mb-1 text-center">Entry</label><input type="number" id="sig-entry-display" step="any" class="w-full bg-transparent font-mono text-base font-bold text-white outline-none text-center" oninput="document.getElementById('sig-entry').value=this.value"></div><div class="bg-surface2 p-2 rounded-lg border border-line"><label class="block text-[9px] font-mono text-muted uppercase mb-1 text-center">SL</label><input type="number" id="sig-sl-display" step="any" class="w-full bg-transparent font-mono text-base font-bold text-loss outline-none text-center" oninput="document.getElementById('sig-sl').value=this.value"></div><div class="bg-surface2 p-2 rounded-lg border border-line"><label class="block text-[9px] font-mono text-muted uppercase mb-1 text-center">TP</label><input type="number" id="sig-tp-display" step="any" class="w-full bg-transparent font-mono text-base font-bold text-win outline-none text-center" oninput="document.getElementById('sig-tp').value=this.value"></div></div>
        <div class="bg-surface2 p-3 rounded-xl border border-line"><label class="block text-[10px] font-mono text-muted uppercase mb-1">Analysis</label><textarea id="sig-notes" rows="3" class="w-full bg-transparent text-sm text-white outline-none resize-none"></textarea></div>
      </div>
      <button type="submit" id="submit-btn" class="w-full py-3.5 bg-accent text-bg font-bold text-lg rounded-xl mt-2 hover:brightness-110 transition-all">Publish Signal</button>
    </form>
  </dialog>

  <!-- Custom Alert Modal -->
  <dialog id="custom-alert" class="bg-surface text-text w-full max-w-sm m-auto rounded-2xl border border-line p-0 backdrop:bg-black/80 backdrop:backdrop-blur-sm">
    <div class="p-6 text-center">
      <div id="alert-icon" class="mx-auto mb-4 w-14 h-14 rounded-full flex items-center justify-center"><svg id="alert-svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"></svg></div>
      <h3 id="alert-title" class="text-lg font-bold text-white mb-2">Notice</h3>
      <p id="alert-message" class="text-sm text-muted mb-6"></p>
      <button onclick="hideAlert()" class="w-full py-3 bg-surface2 border border-line text-white font-bold rounded-xl hover:border-accent transition-colors">Close</button>
    </div>
  </dialog>

  <script src="app2.js"></script>
</body>
</html>
