<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>Admin Panel · Gongola ICT Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0a0e13', surface: '#1F2833', surface2: '#151E26',
          text: '#eef1fb', muted: '#8d97b8', line: 'rgba(255,255,255,0.1)',
          win: '#00FF66', loss: '#FF3B30', accent: '#00E5FF', open: '#F5A524'
        },
        fontFamily: { display: ['"Space Grotesk"', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] }
      }
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="text-text font-display antialiased overflow-x-hidden min-h-screen">

  <header class="top sticky top-0 z-30 glass border-b border-line px-4 py-3">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center font-bold text-bg shadow-[0_0_10px_rgba(0,229,255,0.4)]">A</div>
        <div><h1 class="font-bold text-lg leading-tight">Admin Panel</h1><p class="text-[10px] font-mono text-muted uppercase tracking-widest">Gongola ICT Hub</p></div>
      </div>
      <div class="flex gap-2">
        <button onclick="toggleSignalModal()" class="px-4 py-2 bg-win text-bg font-bold text-xs rounded-lg shadow-[0_0_15px_rgba(0,255,102,0.3)] hover:brightness-110 transition-all flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg> Post Signal
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-4">
    <div class="grid grid-cols-2 gap-3" id="summary">
      <div class="stat main bg-surface2 border border-line p-3 rounded-xl cursor-pointer" onclick="openAccountInfo()">
        <p class="text-[10px] font-mono text-muted uppercase mb-1">Total P/L</p>
        <p id="ui-total-pl" class="text-lg font-mono font-bold text-muted">$0.00</p>
      </div>
      <div class="stat bg-surface2 border border-line p-3 rounded-xl">
        <p class="text-[10px] font-mono text-muted uppercase mb-1">Open Trades</p>
        <p id="ui-open" class="text-lg font-mono font-bold text-white">0</p>
      </div>
    </div>

    <div class="flex justify-between items-center text-xs font-mono text-muted">
      <span><span class="inline-block w-2 h-2 rounded-full bg-accent mr-1 animate-pulse"></span>Live · updated <span id="ui-upd">--:--</span></span>
      <button onclick="forceSync()" class="text-accent bg-surface2 px-2 py-1 rounded">Retry Sync</button>
    </div>

    <div class="flex gap-2 overflow-x-auto pb-2" id="filters">
      <button class="chip on px-3 py-1 rounded-full border border-accent bg-accent/10 text-accent text-xs font-bold" data-f="all">All <span id="ui-cnt-all">0</span></button>
      <button class="chip px-3 py-1 rounded-full border border-line bg-surface2 text-muted text-xs font-bold" data-f="open">Open <span id="ui-cnt-open">0</span></button>
      <button class="chip px-3 py-1 rounded-full border border-line bg-surface2 text-muted text-xs font-bold" data-f="pending">Waiting <span id="ui-cnt-pending">0</span></button>
      <button class="chip px-3 py-1 rounded-full border border-line bg-surface2 text-muted text-xs font-bold" data-f="closed">Closed <span id="ui-cnt-closed">0</span></button>
    </div>

    <div id="signal-list" class="space-y-3">
      <div class="text-center text-muted text-sm p-8">Connecting to Database...</div>
    </div>
  </main>

  <!-- Post Signal Modal -->
  <div id="signal-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99998;align-items:flex-end;justify-content:center;">
    <div style="background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:24px;max-height:90vh;overflow-y:auto;border:1px solid var(--line);border-bottom:none;">
      <form id="signal-form" style="display:flex;flex-direction:column;gap:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h2 style="font-size:20px;color:#fff;">Post Signal</h2>
          <button type="button" onclick="toggleSignalModal()" style="background:var(--card2);border-radius:50%;padding:8px;color:var(--muted);">✕</button>
        </div>
        <div>
          <label style="display:block;font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;">Upload Chart</label>
          <input type="file" id="sig-image-input" accept="image/*" style="width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--muted);">
          <div id="sig-image-preview-container" style="display:none;margin-top:10px;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);">
            <img id="sig-image-preview" style="width:100%;max-height:200px;object-fit:contain;background:#000;">
            <div id="sig-image-loading" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.7);flex-direction:column;align-items:center;justify-content:center;">
              <div style="width:30px;height:30px;border:3px solid var(--cyan);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:8px;"></div>
              <span style="color:var(--cyan);font-weight:bold;">AI Reading...</span>
            </div>
          </div>
        </div>
        <div id="manual-fields" style="display:none;flex-direction:column;gap:12px;">
          <input type="hidden" id="sig-entry"><input type="hidden" id="sig-sl"><input type="hidden" id="sig-tp">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;">
              <label style="display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">Asset</label>
              <input type="text" id="sig-asset" placeholder="XAUUSD" required style="width:100%;background:transparent;border:none;color:#fff;font-family:var(--mono);font-size:16px;font-weight:bold;outline:none;">
            </div>
            <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;">
              <label style="display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">Category</label>
              <select id="sig-cat" style="width:100%;background:transparent;border:none;color:#fff;font-family:var(--mono);font-size:16px;font-weight:bold;outline:none;">
                <option>Forex</option><option>Crypto</option><option>Indices</option><option>Commodities</option>
              </select>
            </div>
          </div>
          <div style="display:flex;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px;">
            <button type="button" onclick="setSigDir('BUY')" id="sig-btn-buy" style="flex:1;padding:10px;border-radius:8px;font-weight:bold;border:1px solid var(--green);background:rgba(25,230,140,0.1);color:var(--green);">BUY</button>
            <button type="button" onclick="setSigDir('SELL')" id="sig-btn-sell" style="flex:1;padding:10px;border-radius:8px;font-weight:bold;border:1px solid transparent;color:var(--muted);">SELL</button>
            <input type="hidden" id="sig-direction" value="BUY">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
            <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;">
              <label style="display:block;font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px;">Entry</label>
              <input type="number" id="sig-entry-display" step="any" style="width:100%;background:transparent;border:none;color:#fff;font-family:var(--mono);font-weight:bold;text-align:center;outline:none;" oninput="document.getElementById('sig-entry').value=this.value">
            </div>
            <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;">
              <label style="display:block;font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px;">SL</label>
              <input type="number" id="sig-sl-display" step="any" style="width:100%;background:transparent;border:none;color:var(--red);font-family:var(--mono);font-weight:bold;text-align:center;outline:none;" oninput="document.getElementById('sig-sl').value=this.value">
            </div>
            <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;">
              <label style="display:block;font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px;">TP</label>
              <input type="number" id="sig-tp-display" step="any" style="width:100%;background:transparent;border:none;color:var(--green);font-family:var(--mono);font-weight:bold;text-align:center;outline:none;" oninput="document.getElementById('sig-tp').value=this.value">
            </div>
          </div>
          <div style="background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;">
            <label style="display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">Analysis</label>
            <textarea id="sig-notes" rows="3" style="width:100%;background:transparent;border:none;color:#fff;outline:none;resize:none;"></textarea>
          </div>
        </div>
        <button type="submit" id="submit-btn" style="width:100%;padding:16px;background:var(--cyan);color:#000;font-weight:bold;font-size:16px;border-radius:14px;margin-top:8px;">Publish Signal</button>
      </form>
    </div>
  </div>

  <script src="app3.js"></script>
</body>
</html>
