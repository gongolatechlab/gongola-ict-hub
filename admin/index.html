<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin | Gongola ICT Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0B0C10; --surface: #151E26; --surface2: #1F2937; --border: #2D3748; --text: #F3F4F6; --muted: #9CA3AF; --accent: #00E5FF; --win: #00FF66; --loss: #FF3B30; }
    body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .bg-bg { background-color: var(--bg); }
    .bg-surface { background-color: var(--surface); }
    .bg-surface2 { background-color: var(--surface2); }
    .border-line { border-color: var(--border); }
    .text-text { color: var(--text); }
    .text-muted { color: var(--muted); }
    .text-accent { color: var(--accent); }
    .text-win { color: var(--win); }
    .text-loss { color: var(--loss); }
    .border-accent { border-color: var(--accent); }
    .border-win { border-color: var(--win); }
    .border-loss { border-color: var(--loss); }
    .bg-accent { background-color: var(--accent); }
    .bg-win { background-color: var(--win); }
    .bg-loss { background-color: var(--loss); }
    .bg-bg\/80 { background-color: rgba(11, 12, 16, 0.8); }
    .bg-amber-500\/10 { background-color: rgba(245, 158, 11, 0.1); }
    .bg-amber-500\/20 { background-color: rgba(245, 158, 11, 0.2); }
    .border-amber-500 { border-color: #F59E0B; }
    .text-amber-500 { color: #F59E0B; }
    .bg-cyan-400 { background-color: #22D3EE; }
    .text-cyan-400 { color: #22D3EE; }
    .shadow-\[0_0_8px_rgba\(34\,211\,238\,0\.8\)\] { box-shadow: 0 0 8px rgba(34, 211, 238, 0.8); }
    .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    .duration-500 { transition-duration: 500ms; }
    input, select, textarea { font-size: 16px !important; }
    .active-tab { background-color: #00E5FF !important; color: #0B0C10 !important; border-color: #00E5FF !important; }
    .hidden { display: none !important; }
    .opacity-70 { opacity: 0.7; }
  </style>
<script>
window.onerror = function(msg, url, line, col, error) {
  var div = document.createElement('div');
  div.style.cssText = 'padding: 20px; color: red; font-family: monospace; background: white; font-size: 14px; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999;';
  div.innerHTML = 'Error: ' + msg + '<br>Line: ' + line + '<br>URL: ' + url;
  document.documentElement.appendChild(div);
};
</script>
</head>
<body class="text-text font-display antialiased overflow-x-hidden min-h-screen" id="admin-app">

<!-- PIN Gate -->
<div id="pin-gate" class="fixed inset-0 z-[200] bg-bg flex flex-col items-center justify-center p-6">
  <div class="bg-surface border border-line rounded-2xl p-8 max-w-sm w-full text-center">
    <div class="w-16 h-16 bg-surface2 rounded-full flex items-center justify-center mx-auto mb-4 border border-line">
      <svg class="w-8 h-8 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    </div>
    <h2 class="text-xl font-bold mb-2">Admin Access</h2>
    <p class="text-sm text-muted mb-6">Enter your PIN to manage signals.</p>
    <input type="password" id="admin-pin" placeholder="••••" class="w-full bg-bg border border-line rounded-lg px-4 py-3 text-center text-2xl tracking-widest text-white focus:outline-none focus:border-accent mb-4">
    <button onclick="checkPin()" class="w-full py-3 bg-accent text-bg font-bold rounded-lg hover:opacity-90 transition-opacity">Unlock</button>
  </div>
</div>

<!-- Main App -->
<header class="sticky top-0 z-50 bg-bg/80 backdrop-blur-md border-b border-line px-4 py-3 flex justify-between items-center">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 bg-surface2 rounded-lg flex items-center justify-center border border-line">
      <span class="text-accent font-bold text-xl">A</span>
    </div>
    <div>
      <h1 class="text-lg font-bold">Admin Panel <span style="color:red; font-size:14px;">V19-FINAL</span></h1>
      <p class="text-[10px] text-muted font-mono tracking-wider">GONGOLA ICT HUB</p>
    </div>
  </div>
  <button onclick="toggleSignalModal()" class="bg-win text-bg px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-1 hover:opacity-90 transition-opacity">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg> Post Signal
  </button>
</header>

<main class="max-w-3xl mx-auto p-4 space-y-4 pb-24">
  <div id="pl-strip" class="bg-surface2 border border-line rounded-xl p-3 grid grid-cols-3 gap-2 text-center hidden">
    <div>
      <div class="text-[9px] text-muted uppercase mb-1">Total P/L</div>
      <div id="pl-total" class="text-sm font-mono font-bold text-white">$0.00</div>
    </div>
    <div>
      <div class="text-[9px] text-muted uppercase mb-1">Open Trades</div>
      <div id="pl-count" class="text-sm font-mono font-bold text-white">0</div>
    </div>
    <div>
      <div class="text-[9px] text-muted uppercase mb-1">Last Update</div>
      <div id="pl-time" class="text-sm font-mono font-bold text-muted">--:--</div>
    </div>
  </div>
  <div id="signal-list" class="space-y-4"><div class="text-center text-muted text-sm p-8">Loading signals...</div></div>
</main>

<script>
  const SUPABASE_URL = 'https://usayycqwgdyklfzrinvc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_aRLgeNmCRrvmOsW8d7YOlA_lEtVuGaE';
  const EXECUTE_ENDPOINT = "https://script.google.com/macros/s/AKfycbyDNGb5VOJvIpbblUBd1PQaTiEvtqWc5wjNo8bXY4HCyIAYQLc9FWOA0YXktFEpqxIl/exec";

  let supabaseClient = null;
  let signalsData = [];
  let livePositions = [];

  function checkPin() {
    const pin = document.getElementById('admin-pin').value;
    if (pin === "1973") {
      document.getElementById('pin-gate').classList.add('hidden');
      document.getElementById('admin-app').classList.remove('hidden');
      document.getElementById('admin-app').classList.add('block');
      
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      fetchSignals();
      fetchPositions();
      setInterval(fetchPositions, 30000);
    } else {
      alert("Incorrect PIN");
    }
  }

  async function fetchSignals() {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient.from('signals').select('*').order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    signalsData = data;
    renderSignals();
  }

  async function fetchPositions() {
    if (!supabaseClient) return;
    try {
      const res = await fetch(EXECUTE_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'positions' }) });
      const data = await res.json();
      if (data.status === 'success' && data.data.positions) {
        livePositions = data.data.positions;
        
        const strip = document.getElementById('pl-strip');
        if (strip) {
          if (livePositions.length > 0) {
            strip.classList.remove('hidden');
            let totalUpl = 0;
            livePositions.forEach(p => { totalUpl += (p.position.upl || 0); });
            
            const totalEl = document.getElementById('pl-total');
            totalEl.innerText = (totalUpl >= 0 ? '+$' : '-$') + Math.abs(totalUpl).toFixed(2);
            totalEl.className = 'text-sm font-mono font-bold ' + (totalUpl >= 0 ? 'text-win' : 'text-loss');
            
            document.getElementById('pl-count').innerText = livePositions.length;
            document.getElementById('pl-time').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          } else {
            strip.classList.add('hidden');
          }
        }
        renderSignals();
      }
    } catch(e) { console.error("Positions fetch failed", e); }
  }

  function timeAgo(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const seconds = Math.floor((now - date) / 1000);
    if (seconds < 60) return `${seconds}s ago`;
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    return `${days}d ago`;
  }

  function renderSignals() {
    const list = document.getElementById('signal-list');
    if (signalsData.length === 0) return list.innerHTML = '<div class="text-center text-muted text-sm p-8">No signals found.</div>';

    list.innerHTML = signalsData.map(s => {
      const isPending = s.result === 'pending' || !s.result;
      
      // Bulletproof matching
      let livePos = livePositions.find(p => {
        if (!p.position) return false;
        const targetId = s.deal_id ? String(s.deal_id).toLowerCase().trim() : '';
        const pDeal = p.position.dealId ? String(p.position.dealId).toLowerCase().trim() : '';
        const pWork = p.position.workingOrderId ? String(p.position.workingOrderId).toLowerCase().trim() : '';
        if (targetId && (pDeal === targetId || pWork === targetId)) return true;
        return false;
      });
      
      // Fallback: if exactly 1 open trade, match pending direction
      if (!livePos && isPending && livePositions.length === 1) {
        const liveDir = String(livePositions[0].position.direction).toUpperCase().trim();
        if (liveDir === String(s.direction).toUpperCase().trim()) livePos = livePositions[0];
      }

      let actualStatus = isPending ? 'PENDING' : s.result.toUpperCase();
      let statusColor = isPending ? 'border-accent' : s.result === 'win' ? 'border-win' : 'border-loss';
      let statusBg = isPending ? 'bg-accent/10 text-accent' : s.result === 'win' ? 'bg-win/10 text-win' : 'bg-loss/10 text-loss';
      
      if (livePos) {
        actualStatus = 'OPEN';
        statusColor = 'border-amber-500';
        statusBg = 'bg-amber-500/10 text-amber-500';
      }

      let execBtn = '';
      if (!isPending) {
        execBtn = '<button disabled class="flex-1 py-2 bg-surface2 text-muted rounded-lg text-[10px] font-bold min-w-[70px] border border-line">Closed</button>';
      } else if (livePos) {
        const upl = livePos.position.upl || 0;
        const uplColor = upl >= 0 ? 'text-win' : 'text-loss';
        const uplText = upl >= 0 ? `+$${upl.toFixed(2)}` : `-$${Math.abs(upl).toFixed(2)}`;
        execBtn = `<button onclick="fetchPositions()" class="flex-1 py-2 bg-amber-500/20 text-amber-500 border border-amber-500 rounded-lg text-[10px] font-bold min-w-[70px] flex justify-center gap-1 items-center">Open <span class="${uplColor}">${uplText}</span></button>`;
      } else {
        execBtn = `<button onclick="executeTrade('${s.id}')" class="flex-1 py-2 bg-win text-bg rounded-lg text-[10px] font-bold min-w-[70px]">Execute</button>`;
      }

      const risk = Math.abs(s.entry - s.sl); const reward = Math.abs(s.tp - s.entry);
      const rr = risk > 0 ? (reward / risk).toFixed(1) : '--';
      const rrColor = rr >= 1.5 ? 'text-win' : rr >= 1 ? 'text-yellow-400' : 'text-loss';

      const slPts = (s.entry - s.sl).toFixed(1);
      const tpPts = (s.tp - s.entry).toFixed(1);
      const aliasTag = s.alias ? `<span class="text-[9px] text-muted ml-1">also ${s.alias}</span>` : '';

      const prices = [s.entry, s.sl, s.tp];
      const min = Math.min(...prices); const max = Math.max(...prices); const range = max - min || 1;
      const pctSL = ((s.sl - min) / range) * 100; const pctEntry = ((s.entry - min) / range) * 100; const pctTP = ((s.tp - min) / range) * 100;
      const leftPin = Math.min(pctSL, pctTP); const rightPin = Math.max(pctSL, pctTP);
      
      let pctCurrent = 0; let currentPrice = 0; let showLivePin = false;
      if (livePos && livePos.market) {
        currentPrice = livePos.market.bid;
        pctCurrent = ((currentPrice - min) / range) * 100;
        pctCurrent = Math.max(0, Math.min(100, pctCurrent));
        showLivePin = true;
      }

      return `
      <div class="sig-card border border-line rounded-xl overflow-hidden mb-3 border-l-4 ${statusColor} ${!isPending && !livePos ? 'opacity-70' : ''}">
        <div class="p-4 border-b border-line flex justify-between items-center bg-surface2">
          <div class="flex items-center gap-3">
            <span class="text-lg font-bold font-mono">${s.asset}${aliasTag}</span>
            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${s.direction === 'BUY' ? 'bg-win/10 text-win' : 'bg-loss/10 text-loss'}">${s.direction}</span>
            <span class="text-[10px] font-mono text-muted" title="${new Date(s.created_at).toLocaleString()}">${timeAgo(s.created_at)}</span>
          </div>
          <div class="flex items-center gap-2">
            ${livePos ? `<span class="text-[9px] font-bold px-2 py-1 rounded bg-bg border border-line ${livePos.position.upl >= 0 ? 'text-win' : 'text-loss'}">${livePos.position.upl >= 0 ? '+' : '-'}$${Math.abs(livePos.position.upl).toFixed(2)}</span>` : ''}
            <span class="text-[9px] font-bold uppercase tracking-wider px-2 py-1 rounded ${statusBg}">${actualStatus}</span>
            <button onclick="deleteSignal('${s.id}')" class="text-muted hover:text-loss transition-colors p-1"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
          </div>
        </div>

        <div class="p-4">
          <div class="flex justify-between items-center mb-4">
             <span class="text-[10px] font-mono ${rrColor} bg-bg px-2 py-1 rounded border border-line">R:R 1:${rr}</span>
          </div>

          <div class="relative h-1.5 bg-bg rounded-full mb-6 mx-2 mt-4">
            <div class="absolute h-full bg-loss/50 rounded-l-full" style="width: ${leftPin}%; left: 0;"></div>
            <div class="absolute h-full bg-win/50 rounded-r-full" style="width: ${100 - rightPin}%; left: ${rightPin}%;"></div>
            <div class="absolute w-0.5 h-3 -top-1 bg-white -translate-x-1/2" style="left: ${pctSL}%;"><span class="absolute -top-4 -translate-x-1/2 text-[8px] text-muted font-bold">SL</span></div>
            <div class="absolute w-0.5 h-3 -top-1 bg-accent -translate-x-1/2 z-10" style="left: ${pctEntry}%;"><span class="absolute -top-4 -translate-x-1/2 text-[8px] text-accent font-bold">ENTRY</span></div>
            <div class="absolute w-0.5 h-3 -top-1 bg-white -translate-x-1/2" style="left: ${pctTP}%;"><span class="absolute -top-4 -translate-x-1/2 text-[8px] text-muted font-bold">TP</span></div>
            ${showLivePin ? `<div class="absolute w-0.5 h-4 -top-1.5 bg-cyan-400 -translate-x-1/2 z-20 shadow-[0_0_8px_rgba(34,211,238,0.8)] transition-all duration-500" style="left: ${pctCurrent}%;"><span class="absolute -top-5 -translate-x-1/2 text-[9px] text-cyan-400 font-bold whitespace-nowrap bg-bg/80 px-1 rounded">${currentPrice}</span></div>` : ''}
          </div>

          <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="bg-bg rounded-lg border border-line p-2 text-center"><div class="text-[9px] text-muted uppercase mb-1">Entry</div><div class="text-xs font-mono font-bold text-white">${s.entry}</div></div>
            <div class="bg-bg rounded-lg border border-line p-2 text-center"><div class="text-[9px] text-muted uppercase mb-1">SL</div><div class="text-xs font-mono font-bold text-loss">${s.sl}</div><div class="text-[8px] font-mono text-loss mt-0.5">${slPts} pts</div></div>
            <div class="bg-bg rounded-lg border border-line p-2 text-center"><div class="text-[9px] text-muted uppercase mb-1">TP</div><div class="text-xs font-mono font-bold text-win">${s.tp}</div><div class="text-[8px] font-mono text-win mt-0.5">+${tpPts} pts</div></div>
          </div>

          <div class="flex border-b border-line mb-3">
            <button onclick="toggleAdminTab('${s.id}', 'chart', this)" class="tab-btn flex-1 py-2 text-[11px] font-bold text-muted border-b-2 border-transparent hover:text-white transition-all">Chart</button>
            <button onclick="toggleAdminTab('${s.id}', 'analysis', this)" class="tab-btn flex-1 py-2 text-[11px] font-bold text-muted border-b-2 border-transparent hover:text-white transition-all">Analysis</button>
          </div>

          <div id="a-panel-chart-${s.id}" class="hidden mb-3">
            ${s.image_url ? `<img src="${s.image_url}" alt="Chart" class="w-full rounded-lg border border-line">` : '<p class="text-[10px] text-muted">No chart image.</p>'}
          </div>
          <div id="a-panel-analysis-${s.id}" class="hidden mb-3">
            <p class="text-[11px] text-muted bg-bg p-2 rounded border border-line leading-relaxed">${s.analysis || 'No analysis.'}</p>
          </div>
        </div>

        <div class="p-3 border-t border-line flex flex-wrap gap-2 bg-surface2 mt-2">
          ${execBtn}
          <button onclick="updateResult('${s.id}', 'win')" class="flex-1 py-2 bg-bg border border-line rounded-lg text-[10px] font-bold text-muted hover:text-win hover:border-win min-w-[70px]">Win</button>
          <button onclick="updateResult('${s.id}', 'loss')" class="flex-1 py-2 bg-bg border border-line rounded-lg text-[10px] font-bold text-muted hover:text-loss hover:border-loss min-w-[70px]">Loss</button>
          <button onclick="copyAdminTrade('${s.asset}', '${s.direction}', ${s.entry}, ${s.sl}, ${s.tp}, '${rr}')" class="py-2 px-3 bg-bg border border-line rounded-lg text-[10px] font-bold text-muted hover:text-white hover:border-accent">Copy</button>
        </div>
      </div>`}).join('');
  }

  async function executeTrade(id) {
    const sig = signalsData.find(s => s.id === id);
    if (!sig) return;
    if (!confirm(`Execute ${sig.direction} ${sig.asset} on Capital.com DEMO account?`)) return;
    showAlert("Sending order to Capital.com...", "success");
    try {
      const res = await fetch(EXECUTE_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ epic: sig.asset, direction: sig.direction, size: 1.0, stopLevel: sig.sl, profitLevel: sig.tp }) });
      const data = await res.json();
      if (data.status === 'success') {
        const dealId = data.data.dealId || data.data.dealReference;
        if (dealId) {
          await supabaseClient.from('signals').update({ deal_id: dealId }).eq('id', id);
          sig.deal_id = dealId;
        }
        showAlert("Trade Executed! Deal ID: " + dealId, "success");
        fetchPositions();
      } else {
        let errorMsg = data.detail || 'Unknown error';
        try { const parsed = JSON.parse(errorMsg); errorMsg = parsed.errorCode || errorMsg; } catch(e) {}
        showAlert("Execution Failed: " + errorMsg, "error");
      }
    } catch (err) { showAlert("Connection failed.", "error"); }
  }

  async function updateResult(id, result) {
    const { error } = await supabaseClient.from('signals').update({ result }).eq('id', id);
    if (error) return showAlert('Failed to update status', 'error');
    const sig = signalsData.find(s => s.id === id);
    if (sig) sig.result = result;
    renderSignals();
  }

  async function deleteSignal(id) {
    if (!confirm("Delete this signal permanently?")) return;
    const { error } = await supabaseClient.from('signals').delete().eq('id', id);
    if (error) return showAlert('Failed to delete', 'error');
    signalsData = signalsData.filter(s => s.id !== id);
    renderSignals();
  }

  function toggleAdminTab(id, tab, btn) {
    const target = document.getElementById('a-panel-' + tab + '-' + id);
    if (!target) return;
    const wasOpen = !target.classList.contains('hidden');
    ['chart', 'analysis'].forEach(t => {
      const el = document.getElementById('a-panel-' + t + '-' + id);
      if (el) el.classList.add('hidden');
    });
    const parent = btn.parentElement;
    parent.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.remove('text-white', 'border-accent');
      b.classList.add('text-muted', 'border-transparent');
    });
    if (!wasOpen) {
      target.classList.remove('hidden');
      btn.classList.remove('text-muted', 'border-transparent');
      btn.classList.add('text-white', 'border-accent');
    }
  }

  function copyAdminTrade(symbol, direction, entry, sl, tp, rr) {
    var text = direction + ' ' + symbol + '\n' + 'Entry: ' + entry + '\n' + 'SL: ' + sl + '\n' + 'TP: ' + tp + '\n' + 'R:R 1:' + rr;
    if (navigator.clipboard) { navigator.clipboard.writeText(text).then(() => alert('Copied!')).catch(() => alert(text)); }
    else { alert(text); }
  }

  function showAlert(msg, type) {
    alert(msg);
  }

  function toggleSignalModal() { alert("Post Signal modal coming soon."); }

</script>
</body>
</html>
