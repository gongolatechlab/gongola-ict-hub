<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Global Signals | Gongola Tech Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0B0F17;
    --card: #121826;
    --raised: #171F30;
    --border: #222B3F;
    --text: #E8ECF4;
    --muted: #8793AB;
    --gold: #F5C451;
    --buy: #22C55E;
    --sell: #F0506E;
    --pending: #F5A524;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom, 40px);
    -webkit-font-smoothing: antialiased;
  }

  /* Sticky Header */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11, 15, 23, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 32px; height: 32px; background: var(--gold); color: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
  .header-titles h1 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
  .header-titles p { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer; transition: 0.2s; }
  .icon-btn:active { background: var(--raised); }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
  
  /* Search Input */
  .search-bar { display: none; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .search-bar.active { display: block; }
  .search-bar input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--text); font-size: 16px; outline: none; }
  .search-bar input:focus { border-color: var(--gold); }

  /* Main Container */
  .container { max-width: 1080px; margin: 0 auto; padding: 16px; }

  /* Notice Banner */
  .notice-banner { background: rgba(245, 196, 81, 0.1); border: 1px solid rgba(245, 196, 81, 0.3); border-radius: 12px; padding: 12px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .notice-banner p { font-size: 12px; color: var(--gold); line-height: 1.4; }
  .notice-banner button { background: none; border: none; color: var(--gold); font-size: 18px; cursor: pointer; padding: 4px; }

  /* Stats Strip */
  .stats-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  @media(min-width: 600px) { .stats-strip { grid-template-columns: repeat(4, 1fr); } }
  .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .stat-box label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; font-weight: 500; }
  .stat-box .val { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
  .stat-box .val.green { color: var(--buy); }
  .stat-box .val.red { color: var(--sell); }
  .stat-box .val.amber { color: var(--pending); }

  /* Filters */
  .filters-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; mask-image: linear-gradient(to right, black 85%, transparent 100%); }
  .filters-row::-webkit-scrollbar { display: none; }
  .filter-chip { padding: 8px 16px; border-radius: 99px; background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: 0.2s; }
  .filter-chip.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }

  /* Segmented Control */
  .seg-control { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--card); padding: 4px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 16px; }
  .seg-btn { padding: 8px; border-radius: 6px; border: none; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
  .seg-btn.active { background: var(--raised); color: var(--text); font-weight: 600; }

  /* Signal Count */
  .signal-count { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 12px; }

  /* Grid */
  .signal-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media(min-width: 820px) { .signal-grid { grid-template-columns: 1fr 1fr; } }

  /* Signal Card */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; position: relative; display: flex; flex-direction: column; opacity: 0; transform: translateY(10px); animation: fadeIn 0.4s forwards; }
  @keyframes fadeIn { to { opacity: 1; transform: none; } }
  .card.pending { box-shadow: 0 0 20px rgba(245, 165, 36, 0.1); }
  .card.closed { opacity: 0.6; }
  
  /* Left Edge */
  .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .card.status-pending::before { background: var(--pending); }
  .card.status-win::before { background: var(--buy); }
  .card.status-loss::before { background: var(--sell); }

  /* Card Body */
  .card-body { padding: 16px; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .symbol-wrap { display: flex; align-items: center; gap: 8px; }
  .symbol { font-size: 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .direction { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
  .direction.buy { background: rgba(34, 197, 94, 0.15); color: var(--buy); }
  .direction.sell { background: rgba(240, 80, 110, 0.15); color: var(--sell); }
  
  .status-pill { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .status-pill.pending { background: rgba(245, 165, 36, 0.15); color: var(--pending); }
  .status-pill.win { background: rgba(34, 197, 94, 0.15); color: var(--buy); }
  .status-pill.loss { background: rgba(240, 80, 110, 0.15); color: var(--sell); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .meta-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .time { font-size: 12px; color: var(--muted); }
  .rr-chip { font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; padding: 4px 8px; border-radius: 6px; }
  .rr-chip.good { background: rgba(34, 197, 94, 0.15); color: var(--buy); }
  .rr-chip.mid { background: rgba(245, 165, 36, 0.15); color: var(--pending); }
  .rr-chip.bad { background: rgba(240, 80, 110, 0.15); color: var(--sell); }

  /* Price Bar */
  .price-bar-wrap { margin-bottom: 16px; position: relative; padding-top: 20px; }
  .price-track { height: 6px; background: var(--raised); border-radius: 99px; display: flex; position: relative; }
  .zone-sl { background: rgba(240, 80, 110, 0.5); height: 100%; border-radius: 99px 0 0 99px; }
  .zone-tp { background: rgba(34, 197, 94, 0.5); height: 100%; border-radius: 0 99px 99px 0; }
  .pin { position: absolute; top: -4px; width: 2px; height: 14px; background: #fff; transform: translateX(-50%); }
  .pin-label { position: absolute; top: -20px; font-size: 9px; font-weight: 700; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
  .pin.entry { background: var(--gold); z-index: 2; width: 3px; }
  .pin.entry .pin-label { color: var(--gold); }

  /* Level Boxes */
  .levels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .level-box { background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
  .level-box label { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .level-box .price { font-size: 14px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .level-box .pts { font-size: 10px; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .level-box.sl .price, .level-box.sl .pts { color: var(--sell); }
  .level-box.tp .price, .level-box.tp .pts { color: var(--buy); }
  .level-box.entry .price { color: var(--text); }

  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-panel { display: none; margin-bottom: 12px; }
  .tab-panel.active { display: block; }
  .tab-panel img { width: 100%; border-radius: 8px; border: 1px solid var(--border); }
  .tab-panel p { font-size: 13px; color: var(--muted); line-height: 1.5; }

  /* Actions */
  .actions { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
  .action-btn { flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--raised); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .action-btn:active { background: var(--card); }
  .action-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

  /* Skeletons */
  .skeleton { background: linear-gradient(90deg, var(--card) 25%, var(--raised) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 16px; height: 300px; border: 1px solid var(--border); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Empty State */
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--gold); color: #000; padding: 12px 24px; border-radius: 99px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">G</div>
    <div class="header-titles">
      <h1>Global Signals</h1>
      <p>Gongola Tech Lab</p>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="search-toggle"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></button>
    <button class="icon-btn" id="refresh-btn"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></button>
  </div>
</header>

<div class="search-bar" id="search-bar">
  <input type="text" id="search-input" placeholder="Search by symbol (e.g. XAUUSD)">
</div>

<div class="container">
  <!-- Notice -->
  <div class="notice-banner" id="notice-banner">
    <p>Educational purposes only. Not financial advice. Trade at your own risk.</p>
    <button onclick="document.getElementById('notice-banner').style.display='none'">✕</button>
  </div>

  <!-- Stats -->
  <div class="stats-strip">
    <div class="stat-box"><label>Win Rate</label><div class="val" id="stat-winrate">0%</div></div>
    <div class="stat-box"><label>Total Signals</label><div class="val" id="stat-total">0</div></div>
    <div class="stat-box"><label>Active</label><div class="val amber" id="stat-active">0</div></div>
    <div class="stat-box"><label>Net Points</label><div class="val" id="stat-net">0</div></div>
  </div>

  <!-- Category Filters -->
  <div class="filters-row" id="category-filters">
    <button class="filter-chip active" data-cat="All">All</button>
    <button class="filter-chip" data-cat="Forex">Forex</button>
    <button class="filter-chip" data-cat="Crypto">Crypto</button>
    <button class="filter-chip" data-cat="Indices">Indices</button>
    <button class="filter-chip" data-cat="Commodities">Commodities</button>
  </div>

  <!-- Status Segmented Control -->
  <div class="seg-control" id="status-filters">
    <button class="seg-btn active" data-status="all">All</button>
    <button class="seg-btn" data-status="pending">Active</button>
    <button class="seg-btn" data-status="win">Won</button>
    <button class="seg-btn" data-status="loss">Lost</button>
  </div>

  <div class="signal-count" id="signal-count">0 signals</div>

  <!-- Signal Grid -->
  <div class="signal-grid" id="signal-grid"></div>
</div>

<div class="toast" id="toast">Trade copied</div>

<script>
  const SUPABASE_URL = 'https://usayycqwgdyklfzrinvc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_aRLgeNmCRrvmOsW8d7YOlA_lEtVuGaE';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let rawSignals = [];
  let signals = [];
  let currentCategory = 'All';
  let currentStatus = 'all';
  let searchQuery = '';

  // Init
  document.addEventListener('DOMContentLoaded', () => {
    fetchSignals();

    // UI Toggles
    document.getElementById('search-toggle').onclick = () => {
      const bar = document.getElementById('search-bar');
      bar.classList.toggle('active');
      if(bar.classList.contains('active')) document.getElementById('search-input').focus();
    };
    
    document.getElementById('refresh-btn').onclick = () => {
      document.getElementById('refresh-btn').style.opacity = '0.5';
      fetchSignals().finally(() => {
        setTimeout(() => document.getElementById('refresh-btn').style.opacity = '1', 500);
      });
    };

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.toUpperCase();
      applyFilters();
    });

    document.getElementById('category-filters').addEventListener('click', (e) => {
      if(e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentCategory = e.target.dataset.cat;
      applyFilters();
    });

    document.getElementById('status-filters').addEventListener('click', (e) => {
      if(e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentStatus = e.target.dataset.status;
      applyFilters();
    });
  });

  async function fetchSignals() {
    const grid = document.getElementById('signal-grid');
    grid.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    
    const { data, error } = await supabaseClient.from('signals').select('*').order('created_at', { ascending: false });
    
    if (error || !data) {
      grid.innerHTML = '<div class="empty-state">Failed to load signals.</div>';
      return;
    }
    
    rawSignals = data;
    processData();
  }

  function processData() {
    // 1. De-duplicate GOLD and XAUUSD
    const seen = new Map();
    const deduped = [];

    rawSignals.forEach(sig => {
      // Alias mapping
      let sym = sig.asset.toUpperCase();
      let alias = null;
      if (sym === 'GOLD' || sym === 'XAUUSD') {
        sym = 'XAUUSD'; // Standardize to XAUUSD
        alias = 'GOLD';
      }

      const key = `${sym}-${sig.direction}-${sig.entry}-${sig.sl}-${sig.tp}-${sig.result}`;
      
      if (!seen.has(key)) {
        seen.set(key, true);
        // Create a display object
        deduped.push({
          ...sig,
          displaySymbol: sym,
          originalSymbol: sig.asset,
          alias: alias
        });
      }
    });

    signals = deduped;
    calculateStats();
    applyFilters();
  }

  function calculateStats() {
    const total = signals.length;
    const wins = signals.filter(s => s.result === 'win').length;
    const losses = signals.filter(s => s.result === 'loss').length;
    const active = signals.filter(s => s.result === 'pending' || !s.result).length;
    
    const closed = wins + losses;
    const winRate = closed > 0 ? Math.round((wins / closed) * 100) : 0;
    
    let netPoints = 0;
    signals.forEach(s => {
      if (s.result === 'win') {
        netPoints += Math.abs(s.tp - s.entry);
      } else if (s.result === 'loss') {
        netPoints -= Math.abs(s.sl - s.entry);
      }
    });

    document.getElementById('stat-winrate').innerText = winRate + '%';
    document.getElementById('stat-total').innerText = total;
    document.getElementById('stat-active').innerText = active;
    
    const netEl = document.getElementById('stat-net');
    netEl.innerText = (netPoints > 0 ? '+' : '') + netPoints.toFixed(1);
    netEl.className = 'val ' + (netPoints > 0 ? 'green' : netPoints < 0 ? 'red' : '');
  }

  function applyFilters() {
    let filtered = signals;

    if (currentCategory !== 'All') {
      filtered = filtered.filter(s => s.category.toLowerCase() === currentCategory.toLowerCase());
    }
    
    if (currentStatus !== 'all') {
      if (currentStatus === 'pending') filtered = filtered.filter(s => s.result === 'pending' || !s.result);
      else filtered = filtered.filter(s => s.result === currentStatus);
    }

    if (searchQuery) {
      filtered = filtered.filter(s => s.displaySymbol.includes(searchQuery) || (s.alias && s.alias.includes(searchQuery)));
    }

    document.getElementById('signal-count').innerText = `${filtered.length} signal${filtered.length !== 1 ? 's' : ''}`;
    renderGrid(filtered);
  }

  function timeAgo(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const seconds = Math.floor((now - date) / 1000);
    
    if (seconds < 60) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    return `${days}d ago`;
  }

  function renderGrid(data) {
    const grid = document.getElementById('signal-grid');
    if (data.length === 0) {
      grid.innerHTML = '<div class="empty-state">No signals match these filters.</div>';
      return;
    }

    grid.innerHTML = data.map(s => {
      const isPending = s.result === 'pending' || !s.result;
      const statusClass = isPending ? 'pending' : s.result;
      const statusLabel = isPending ? 'PENDING' : s.result.toUpperCase();
      
      const risk = Math.abs(s.entry - s.sl);
      const reward = Math.abs(s.tp - s.entry);
      const rr = risk > 0 ? (reward / risk).toFixed(1) : '--';
      const rrClass = rr >= 1.5 ? 'good' : rr >= 1 ? 'mid' : 'bad';
      
      // Level calculations for points
      const slPts = (s.entry - s.sl).toFixed(1);
      const tpPts = (s.tp - s.entry).toFixed(1);

      // Visual Price Bar calculations
      const prices = [s.entry, s.sl, s.tp];
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = max - min || 1;
      
      const pctSL = ((s.sl - min) / range) * 100;
      const pctEntry = ((s.entry - min) / range) * 100;
      const pctTP = ((s.tp - min) / range) * 100;
      
      const leftPin = Math.min(pctSL, pctTP);
      const rightPin = Math.max(pctSL, pctTP);
      
      const dateObj = new Date(s.created_at);
      const fullDate = dateObj.toLocaleString();

      const aliasTag = s.alias ? `<span style="font-size:10px;color:var(--muted);margin-left:4px;">also ${s.alias}</span>` : '';

      return `
      <div class="card status-${statusClass} ${isPending ? 'pending' : 'closed'}">
        <div class="card-body">
          <div class="top-row">
            <div class="symbol-wrap">
              <span class="symbol">${s.displaySymbol}${aliasTag}</span>
              <span class="direction ${s.direction.toLowerCase()}">${s.direction}</span>
            </div>
            <span class="status-pill ${statusClass}">
              ${isPending ? '<span class="dot"></span>' : ''} ${statusLabel}
            </span>
          </div>
          
          <div class="meta-row">
            <span class="time" title="${fullDate}">${timeAgo(s.created_at)}</span>
            <span class="rr-chip ${rrClass}">R:R 1:${rr}</span>
          </div>

          <!-- Visual Price Bar -->
          <div class="price-bar-wrap">
            <div class="price-track">
              <div class="zone-sl" style="width: ${leftPin}%;"></div>
              <div class="zone-tp" style="width: ${100 - rightPin}%; margin-left: ${rightPin}%;"></div>
              
              <div class="pin" style="left: ${pctSL}%;"><span class="pin-label">SL</span></div>
              <div class="pin entry" style="left: ${pctEntry}%;"><span class="pin-label" style="color:var(--gold);">ENTRY</span></div>
              <div class="pin" style="left: ${pctTP}%;"><span class="pin-label">TP</span></div>
            </div>
          </div>

          <div class="levels">
            <div class="level-box entry">
              <label>Entry</label>
              <div class="price">${s.entry}</div>
            </div>
            <div class="level-box sl">
              <label>Stop Loss</label>
              <div class="price">${s.sl}</div>
              <div class="pts">${slPts} pts</div>
            </div>
            <div class="level-box tp">
              <label>Take Profit</label>
              <div class="price">${s.tp}</div>
              <div class="pts">+${tpPts} pts</div>
            </div>
          </div>

          <!-- Tabs -->
          <div class="tabs">
            <button class="tab-btn" onclick="toggleTab('${s.id}', 'chart', this)">Chart</button>
            <button class="tab-btn" onclick="toggleTab('${s.id}', 'analysis', this)">Analysis</button>
          </div>
          
          <div id="panel-chart-${s.id}" class="tab-panel">
            ${s.image_url ? `<img src="${s.image_url}" alt="Chart">` : '<p>No chart image available.</p>'}
          </div>
          <div id="panel-analysis-${s.id}" class="tab-panel">
            <p>${s.analysis || 'No analysis provided.'}</p>
          </div>

          <div class="actions">
            <button class="action-btn" onclick="copyTrade('${s.displaySymbol}', '${s.direction}', ${s.entry}, ${s.sl}, ${s.tp}, ${rr})">
              <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              Copy
            </button>
            <button class="action-btn" onclick="shareTrade('${s.displaySymbol}', '${s.direction}', ${s.entry}, ${s.sl}, ${s.tp}, ${rr})">
              <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
              Share
            </button>
          </div>
        </div>
      </div>
      `;
    }).join('');
  }

  function toggleTab(id, tab, btn) {
    const chartPanel = document.getElementById(`panel-chart-${id}`);
    const analysisPanel = document.getElementById(`panel-analysis-${id}`);
    const isActive = btn.classList.contains('active');
    
    // Reset all in this card
    btn.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    chartPanel.classList.remove('active');
    analysisPanel.classList.remove('active');
    
    if (!isActive) {
      btn.classList.add('active');
      if (tab === 'chart') chartPanel.classList.add('active');
      else analysisPanel.classList.add('active');
    }
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function copyTrade(sym, dir, entry, sl, tp, rr) {
    const text = `${sym} ${dir}\nEntry: ${entry}\nSL: ${sl}\nTP: ${tp}\nR:R 1:${rr}\n\nEducational purposes only. Not financial advice.`;
    navigator.clipboard.writeText(text).then(() => showToast());
  }

  function shareTrade(sym, dir, entry, sl, tp, rr) {
    const text = `${sym} ${dir}\nEntry: ${entry}\nSL: ${sl}\nTP: ${tp}\nR:R 1:${rr}\n\nEducational purposes only. Not financial advice.`;
    if (navigator.share) {
      navigator.share({ title: `${sym} Signal`, text }).catch(() => {});
    } else {
      copyTrade(sym, dir, entry, sl, tp, rr);
    }
  }
</script>
</body>
</html>
